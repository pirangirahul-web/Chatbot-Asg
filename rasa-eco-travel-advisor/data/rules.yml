version: "3.1"

rules:
- rule: Say goodbye anytime
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Start trip intake on greet
  steps:
    - intent: greet
    - action: utter_greet
    - action: trip_intake_form
    - active_loop: trip_intake_form

- rule: Start trip intake on plan_trip
  steps:
    - intent: plan_trip
    - action: trip_intake_form
    - active_loop: trip_intake_form

# ─── Keep the form alive while the user answers each required slot ───

- rule: Keep form running on destination
  condition:
    - active_loop: trip_intake_form
  steps:
    - intent: inform_destination
    - action: trip_intake_form
    - active_loop: trip_intake_form

- rule: Keep form running on dates
  condition:
    - active_loop: trip_intake_form
  steps:
    - intent: inform_dates
    - action: trip_intake_form
    - active_loop: trip_intake_form

- rule: Keep form running on budget
  condition:
    - active_loop: trip_intake_form
  steps:
    - intent: inform_budget
    - action: trip_intake_form
    - active_loop: trip_intake_form

- rule: Keep form running on sustainability
  condition:
    - active_loop: trip_intake_form
  steps:
    - intent: inform_sustainability
    - action: trip_intake_form
    - active_loop: trip_intake_form

- rule: Keep form running on transport mode
  condition:
    - active_loop: trip_intake_form
  steps:
    - intent: inform_transport_mode
    - action: trip_intake_form
    - active_loop: trip_intake_form

# ─── When all slots filled, submit form and run the recommendation pipeline ───

- rule: Submit form and recommend
  condition:
    - active_loop: trip_intake_form
  steps:
    - action: trip_intake_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: action_fetch_hotels_flights
    - action: action_rank_options
    - action: action_calculate_carbon

# ─── Standalone intents ───

- rule: Ask for transport mode
  steps:
    - intent: ask_green_transport
    - action: utter_ask_transport_mode

- rule: Handle carbon inquiry
  steps:
    - intent: ask_carbon_footprint
    - action: action_calculate_carbon

- rule: Handle eco hotel inquiry
  steps:
    - intent: ask_eco_hotels
    - action: action_fetch_hotels_flights
    - action: action_rank_options

- rule: Handle human handover
  steps:
    - intent: request_human_advisor
    - action: action_handover_to_human
    - action: utter_handover
    - action: utter_handover_confirmation

- rule: Handle out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: Two-stage fallback
  steps:
    - intent: nlu_fallback
    - action: action_two_stage_clarification