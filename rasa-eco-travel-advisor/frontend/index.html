<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <title>Eco-Travel Advisor 🌱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-50:  #ecfdf5;
      --green-100: #d1fae5;
      --green-200: #a7f3d0;
      --green-400: #34d399;
      --green-500: #10b981;
      --green-600: #059669;
      --green-700: #047857;
      --amber-100: #fef3c7;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --red-100:   #fee2e2;
      --red-400:   #f87171;
      --red-500:   #ef4444;
      --gray-50:   #f9fafb;
      --gray-100:  #f3f4f6;
      --gray-200:  #e5e7eb;
      --gray-400:  #9ca3af;
      --gray-600:  #4b5563;
      --gray-800:  #1f2937;
      --gray-900:  #111827;
      --radius-sm: 8px;
      --radius:    14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --shadow:    0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
      --header-h:  64px;
      --composer-h: 76px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: linear-gradient(160deg, #f0fdf4 0%, #ecfeff 100%);
      color: var(--gray-800);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ─── App container with background image ─── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 920px;
      margin: 0 auto;
      background: #fff;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      background-image: url('images/img10.jpeg');
      background-size: cover;
      background-position: center;
      background-blend-mode: overlay;
      background-color: rgba(255, 255, 255, 0.7);
    }

    @media (min-width: 900px) {
      body { padding: 24px; }
      #app {
        height: calc(100dvh - 48px);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
    }

    /* ─── Header ─────────────────────────────────────────── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      min-height: var(--header-h);
      background: linear-gradient(120deg, var(--green-600), var(--green-500));
      color: #fff;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 10;
      padding-top: max(14px, env(safe-area-inset-top));
    }

    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 24px;
      background: rgba(255,255,255,.22);
      backdrop-filter: blur(6px);
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,.4);
    }

    .header-text { flex: 1; min-width: 0; }
    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-text .status {
      font-size: 12px;
      opacity: .9;
      display: flex; align-items: center; gap: 6px;
      margin-top: 2px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #a7f3d0;
      box-shadow: 0 0 0 0 rgba(167,243,208,.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(167,243,208,.7); }
      70%  { box-shadow: 0 0 0 8px rgba(167,243,208,0); }
      100% { box-shadow: 0 0 0 0 rgba(167,243,208,0); }
    }

    .handover-badge {
      display: none;
      background: var(--amber-400);
      color: var(--gray-900);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      animation: fadeIn .3s ease;
    }
    .handover-badge.visible { display: inline-block; }

    .header-actions {
      display: flex; gap: 6px;
    }
    .icon-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      width: 38px; height: 38px;
      border-radius: 10px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .15s;
      font-size: 16px;
    }
    .icon-btn:hover { background: rgba(255,255,255,.28); }
    .icon-btn:active { transform: scale(.95); }

    /* ─── Messages ───────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at 20% 0%, rgba(16,185,129,.04), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(6,182,212,.05), transparent 40%);
      position: relative;
      z-index: 1;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 100%;
      animation: slideUp .28s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 15px;
      flex-shrink: 0;
      background: var(--green-100);
      color: var(--green-700);
    }
    .msg-row.user .msg-avatar {
      background: var(--gray-800);
      color: #fff;
    }

    .bubble {
      max-width: min(80%, 620px);
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      box-shadow: var(--shadow-sm);
    }

    .msg-row.bot .bubble {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-bottom-left-radius: 6px;
      color: var(--gray-800);
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .bubble strong { font-weight: 600; }
    .bubble a { color: var(--green-600); text-decoration: underline; }
    .msg-row.user .bubble a { color: #fff; }

    /* ─── Colour-coded cards ─────────────────────────────── */
    .card {
      border-radius: var(--radius);
      padding: 14px 16px;
      max-width: min(85%, 620px);
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.55;
      animation: slideUp .3s ease;
      border-left: 5px solid var(--gray-400);
      background: #fff;
    }
    .card + .card { margin-top: 6px; }
    .card .card-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card .card-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 13px;
      color: var(--gray-600);
    }
    .card .card-meta span { display: inline-flex; align-items: center; gap: 4px; }

    .card.level-green { border-left-color: var(--green-500); background: var(--green-50); }
    .card.level-amber { border-left-color: var(--amber-500); background: var(--amber-100); }
    .card.level-red   { border-left-color: var(--red-500);   background: var(--red-100); }

    /* ─── Hotel carousel ────────────────────────────────── */
    .hotel-carousel {
      margin: 18px 0 10px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      background: #fff;
      animation: fadeIn .4s ease;
    }
    .carousel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
      background: linear-gradient(to right, #ffffff, #f9fafb);
      border-bottom: 1px solid var(--gray-100);
    }
    .carousel-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-800);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .carousel-header .badge {
      font-size: 11px;
      font-weight: 500;
      background: var(--green-100);
      color: var(--green-700);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 16px;
      padding: 16px 16px 20px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      background: #fff;
    }
    .carousel-track::-webkit-scrollbar {
      height: 5px;
    }
    .carousel-track::-webkit-scrollbar-thumb {
      background: var(--green-200);
      border-radius: 10px;
    }
    .carousel-track::-webkit-scrollbar-track {
      background: var(--gray-100);
      border-radius: 10px;
    }
    .hotel-card {
      flex: 0 0 240px;
      scroll-snap-align: start;
      border-radius: var(--radius);
      background: #fff;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
    }
    .hotel-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .hotel-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
      background: var(--gray-100);
    }
    .hotel-card .info {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .hotel-card .info h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hotel-card .info .eco-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--gray-600);
    }
    .hotel-card .info .eco-line .rating {
      color: var(--green-600);
      font-weight: 600;
    }
    .hotel-card .info .price {
      font-weight: 700;
      color: var(--green-700);
      font-size: 15px;
    }
    .hotel-card .info .footprint {
      font-size: 12px;
      color: var(--gray-600);
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--gray-50);
      padding: 4px 8px;
      border-radius: 999px;
      width: fit-content;
    }

    /* ─── Quick replies ──────────────────────────────────── */
    .quick-replies {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 18px 0;
      animation: slideUp .3s ease;
    }
    .qr-btn {
      background: #fff;
      border: 1.5px solid var(--green-500);
      color: var(--green-700);
      padding: 8px 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
      white-space: nowrap;
    }
    .qr-btn:hover {
      background: var(--green-500);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .qr-btn:active { transform: translateY(0); }
    .qr-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ─── Typing indicator ──────────────────────────────── */
    .typing .bubble {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
    }
    .typing .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gray-400);
      animation: typing 1.2s infinite;
    }
    .typing .dot:nth-child(2) { animation-delay: .15s; }
    .typing .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30%           { transform: translateY(-4px); opacity: 1; }
    }

    /* ─── Composer ───────────────────────────────────────── */
    .chat-composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid var(--gray-200);
      position: sticky;
      bottom: 0;
      z-index: 5;
    }

    .composer-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 11px 16px;
      border: 1.5px solid var(--gray-200);
      border-radius: 22px;
      font: inherit;
      font-size: 15px;
      resize: none;
      outline: none;
      background: var(--gray-50);
      transition: border-color .15s, background .15s;
      line-height: 1.4;
      color: var(--gray-800);
    }
    .composer-input:focus {
      border-color: var(--green-500);
      background: #fff;
    }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: transform .15s, box-shadow .15s;
      box-shadow: var(--shadow);
    }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ─── Mobile ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      .chat-messages { padding: 14px 12px 4px; }
      .bubble { max-width: 85%; font-size: 14.5px; }
      .card { max-width: 90%; }
      .quick-replies { padding: 4px 12px 0; }
      .chat-composer { padding: 10px 12px; }
      .header-actions { display: none; }
      .hotel-card { flex: 0 0 200px; }
      .hotel-card img { height: 110px; }
    }

    /* ─── Scrollbar ──────────────────────────────────────── */
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--gray-200);
      border-radius: 3px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

    /* ─── Welcome screen ────────────────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 16px 8px;
      animation: fadeIn .5s ease;
    }
    .welcome .hero {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-100), var(--green-200));
      display: grid; place-items: center;
      font-size: 34px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .welcome h2 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--gray-900);
    }
    .welcome p {
      font-size: 14px;
      color: var(--gray-600);
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 500px;
    }
    .suggestion {
      background: #fff;
      border: 1.5px solid var(--green-200);
      color: var(--green-700);
      padding: 10px 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .suggestion:hover {
      background: var(--green-50);
      border-color: var(--green-500);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* ─── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--gray-900);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 999;
      max-width: 90vw;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { background: var(--red-500); }
    .toast.success { background: var(--green-600); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<div id="app" role="main">
  <!-- Header -->
  <header class="chat-header">
    <div class="avatar" aria-hidden="true">🌱</div>
    <div class="header-text">
      <h1>Eco-Travel Advisor</h1>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Online • Ready to help</span>
      </div>
    </div>
    <span id="handoverBadge" class="handover-badge">🙋 Advisor joined</span>
    <div class="header-actions">
      <button class="icon-btn" id="clearBtn" title="New chat" aria-label="Start new chat">↻</button>
    </div>
  </header>

  <!-- Messages -->
  <main class="chat-messages" id="messages" role="log" aria-live="polite" aria-label="Conversation"></main>

  <!-- Quick replies -->
  <div class="quick-replies" id="quickReplies"></div>

  <!-- Composer -->
  <form class="chat-composer" id="composer" autocomplete="off">
    <textarea
      class="composer-input"
      id="input"
      placeholder="Ask about eco-hotels, carbon, transport…"
      rows="1"
      aria-label="Message"
    ></textarea>
    <button class="send-btn" type="submit" id="sendBtn" aria-label="Send">➤</button>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   Config
   ========================================================= */
const RASA_HOST = window.location.hostname || "localhost";
const RASA_URL  = `${window.location.protocol}//${RASA_HOST}:5005/webhooks/rest/webhook`;
const RASA_STATUS = `${window.location.protocol}//${RASA_HOST}:5005/status`;
const SENDER_ID = "user-" + Math.random().toString(36).slice(2, 10);

const state = { sending: false, handover: false };

const $messages     = document.getElementById("messages");
const $quickReplies = document.getElementById("quickReplies");
const $input        = document.getElementById("input");
const $composer     = document.getElementById("composer");
const $sendBtn      = document.getElementById("sendBtn");
const $statusText   = document.getElementById("statusText");
const $handover     = document.getElementById("handoverBadge");
const $clearBtn     = document.getElementById("clearBtn");
const $toast        = document.getElementById("toast");

function showToast(msg, type = "") {
  $toast.textContent = msg;
  $toast.className = "toast show " + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => $toast.classList.remove("show"), 2800);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function formatText(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\n/g, "<br>");
  return html;
}

function scrollToBottom() {
  requestAnimationFrame(() => { $messages.scrollTop = $messages.scrollHeight; });
}
function clearQuickReplies() { $quickReplies.innerHTML = ""; }

function appendBotBubble(text) {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.innerHTML = `
    <div class="msg-avatar" aria-hidden="true">🌱</div>
    <div class="bubble">${formatText(text)}</div>`;
  $messages.appendChild(row);
  scrollToBottom();
}
function appendUserBubble(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `
    <div class="msg-avatar" aria-hidden="true">🧑</div>
    <div class="bubble">${formatText(text)}</div>`;
  $messages.appendChild(row);
  scrollToBottom();
}

function appendHotelCard(d) {
  const level = d.emoji === "🟢" ? "green" : d.emoji === "🟡" ? "amber" : "red";
  const card = document.createElement("div");
  card.className = `card level-${level}`;
  card.innerHTML = `
    <div class="card-title">${d.emoji || "🏨"} ${escapeHtml(d.name || "Hotel")}</div>
    <div class="card-meta">
      <span>💰 $${escapeHtml(String(d.price ?? "—"))}</span>
      <span>🌿 Eco ${escapeHtml(String(d.eco_rating ?? "—"))}/5</span>
      <span>♻️ ${escapeHtml(String(d.carbon_kg ?? "—"))} kg CO₂e</span>
    </div>`;
  $messages.appendChild(card);
  scrollToBottom();
}

function appendCarbonCard(d) {
  const level = d.level || "green";
  const label = level === "green" ? "Low emission" : level === "amber" ? "Moderate emission" : "High emission";
  const card = document.createElement("div");
  card.className = `card level-${level}`;
  card.innerHTML = `
    <div class="card-title">${d.emoji || "♻️"} ${escapeHtml(label)}</div>
    <div class="card-meta">
      <span>🌍 ${escapeHtml(String(d.co2e ?? "—"))} kg CO₂e</span>
      <span>🚗 ${escapeHtml(String(d.transport || "—"))}</span>
      <span>📍 ${escapeHtml(String(d.origin || ""))} → ${escapeHtml(String(d.destination || ""))}</span>
    </div>`;
  $messages.appendChild(card);
  scrollToBottom();
}

function appendHandoverCard() {
  const card = document.createElement("div");
  card.className = "card level-amber";
  card.innerHTML = `
    <div class="card-title">🙋 Human advisor connected</div>
    <div class="card-meta"><span>Your full context has been shared.</span></div>`;
  $messages.appendChild(card);
  scrollToBottom();
}

function appendQuickReplies(buttons) {
  clearQuickReplies();
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "qr-btn";
    btn.type = "button";
    btn.textContent = b.title;
    btn.onclick = () => {
      clearQuickReplies();
      sendMessage(b.payload || b.title, { silent: false });
    };
    $quickReplies.appendChild(btn);
  });
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot typing";
  row.id = "typingIndicator";
  row.innerHTML = `
    <div class="msg-avatar" aria-hidden="true">🌱</div>
    <div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  $messages.appendChild(row);
  scrollToBottom();
}
function hideTyping() { document.getElementById("typingIndicator")?.remove(); }

function showWelcome() {
  $messages.innerHTML = `
    <div class="welcome">
      <div class="hero" aria-hidden="true">🌱</div>
      <h2>Hi, I'm your Eco-Travel Advisor</h2>
      <p>I can help you find eco-friendly hotels, plan low-carbon transport, and estimate your trip's carbon footprint.</p>
      <div class="suggestions">
        <button class="suggestion" data-msg="Find eco-friendly hotels">🏨 Find eco hotels</button>
        <button class="suggestion" data-msg="Calculate my carbon footprint">♻️ Calculate my carbon</button>
        <button class="suggestion" data-msg="Show me green transportation options">🚆 Green transport</button>
        <button class="suggestion" data-msg="Help me plan a sustainable trip">🌍 Plan a trip</button>
      </div>
    </div>`;
  $messages.querySelectorAll(".suggestion").forEach(btn => {
    btn.onclick = () => { $messages.innerHTML = ""; sendMessage(btn.dataset.msg); };
  });

}

/* ─── Local demo logic (used when Rasa is offline) ─── */
function getLocalDemoResponse(text) {
  const t = text.toLowerCase();
  if (t.includes("hotel") || t.includes("eco hotel") || t.includes("find eco")) {
    return [
      { text: "🌿 Here are some of our top eco‑friendly hotels. Swipe through the carousel below!" },
      { custom: { type: "hotel_carousel" } }
    ];
  }
  if (t.includes("carbon") || t.includes("footprint") || t.includes("calculate")) {
    return [
      { text: "Let me estimate your carbon footprint for a sample trip." },
      { custom: { type: "carbon_card", emoji: "🟢", level: "green", co2e: "12.4", transport: "Train", origin: "Paris", destination: "Amsterdam" } },
      { text: "That's **low emission**! Would you like to try another transport mode?" }
    ];
  }
  if (t.includes("transport") || t.includes("green transport") || t.includes("train") || t.includes("bus")) {
    return [
      { text: "🚆 Train travel is one of the greenest options. A trip from Berlin to Munich emits only ~8 kg CO₂e per person." },
      { custom: { type: "carbon_card", emoji: "🟢", level: "green", co2e: "8.0", transport: "Train", origin: "Berlin", destination: "Munich" } }
    ];
  }
  if (t.includes("plan") || t.includes("trip") || t.includes("sustainable")) {
    return [
      { text: "🌍 I can help you plan a sustainable trip! Here are some ideas:" },
      { text: "• Choose eco‑certified hotels\n• Travel by train or bus\n• Offset your carbon\n• Support local communities" },
      { text: "What destination are you thinking of?" }
    ];
  }
  if (t.includes("hello") || t.includes("hi") || t.includes("hey")) {
    return [{ text: "Hello! 👋 I'm your Eco‑Travel Advisor. Ask me about eco‑hotels, carbon footprints, or green transport." }];
  }
  if (t.includes("carousel") || t.includes("show hotels") || t.includes("see hotels")) {
    return [
      { text: "Here are our eco‑friendly hotels:" },
      { custom: { type: "hotel_carousel" } }
    ];
  }
  return [
    { text: "I'm not sure I understood. Try asking about **eco hotels**, **carbon footprint**, or **green transport**." },
    { text: "You can also click one of the suggestions below." },
    { custom: { type: "hotel_carousel" } }
  ];
}

async function sendMessage(text, opts = {}) {
  if (!text || state.sending) return;
  state.sending = true;
  $sendBtn.disabled = true;
  if (!opts.silent) appendUserBubble(text);
  $input.value = ""; autoResize(); clearQuickReplies(); showTyping();

  try {
    let data;
    try {
      const res = await fetch(RASA_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender: SENDER_ID, message: text }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (rasaErr) {
      console.warn("[chat] Rasa not reachable, using built‑in demo logic", rasaErr);
      data = getLocalDemoResponse(text);
    }

    hideTyping();

    if (!Array.isArray(data) || data.length === 0) {
      appendBotBubble("Hmm, I didn't quite get that. Could you try rephrasing?");
    } else {
      const qrs = [];
      data.forEach(msg => {
        if (msg.custom && msg.custom.type) {
          if (msg.custom.type === "hotel_card")        appendHotelCard(msg.custom);
          else if (msg.custom.type === "carbon_card")  appendCarbonCard(msg.custom);
          else if (msg.custom.type === "handover")     { appendHandoverCard(); setHandover(true); }
          else if (msg.custom.type === "hotel_carousel") appendHotelCarousel();
          return;
        }
        if (msg.text) {
          appendBotBubble(msg.text);
          const lower = msg.text.toLowerCase();
          if (lower.includes("human advisor") || lower.includes("connecting you")) setHandover(true);
        }
        if (Array.isArray(msg.buttons)) {
          msg.buttons.forEach(b => qrs.push({ title: b.title, payload: b.payload }));
        }
      });
      if (qrs.length) appendQuickReplies(qrs);
    }
  } catch (err) {
    hideTyping();
    console.error("[chat] error", err);
    showToast("Couldn't reach the advisor. Retrying…", "error");
    appendBotBubble("⚠️ I'm having trouble reaching the server. Please check the connection and try again.");
  } finally {
    state.sending = false;
    $sendBtn.disabled = false;
    $input.focus();
  }
}

function setHandover(on) {
  state.handover = on;
  $handover.classList.toggle("visible", on);
  $statusText.textContent = on ? "Advisor joined • Live" : "Online • Ready to help";
}

function autoResize() {
  $input.style.height = "auto";
  $input.style.height = Math.min($input.scrollHeight, 120) + "px";
}
$input.addEventListener("input", autoResize);
$input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $composer.requestSubmit(); }
});
$composer.addEventListener("submit", e => {
  e.preventDefault();
  const text = $input.value.trim();
  if (text) sendMessage(text);
});
$clearBtn.addEventListener("click", () => {
  if (state.sending) return;
  setHandover(false);
  showWelcome();
  showToast("New conversation started", "success");
});

showWelcome();

/* ─── Auto‑show carousel on first load (optional) ─── */
// Uncomment the next line to display the carousel immediately:
appendHotelCarousel();

$input.focus();

fetch(RASA_STATUS)
  .then(r => r.ok ? null : Promise.reject())
  .catch(() => {
    console.info("Rasa server not reachable — using built‑in demo mode.");
    $statusText.textContent = "Demo mode • Ready";
  });
</script>
